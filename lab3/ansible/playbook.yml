---
- name: Configure web application servers
  hosts: webservers
  become: yes
  vars:
    app_user: deploy
    app_dir: /opt/devops-app

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - nginx
          - nodejs
          - npm
          - git
        state: present

    - name: Create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: yes

    - name: Clone or update application repository
      git:
        repo: "https://github.com/pipphxntom/KRMU_DevOps_Assignments.git"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ app_user }}"

    - name: Install Node.js dependencies
      npm:
        path: "{{ app_dir }}/lab1/app"
        state: present
      become_user: "{{ app_user }}"

    - name: Configure nginx site
      copy:
        dest: /etc/nginx/sites-available/devops-app
        content: |
          server {
            listen 80;
            server_name _;
            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_set_header Host $host;
            }
          }
      notify: restart nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/devops-app
        dest: /etc/nginx/sites-enabled/devops-app
        state: link

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
