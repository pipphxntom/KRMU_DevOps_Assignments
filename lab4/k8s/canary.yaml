# Canary example: stable + canary deployments sharing a service
# Traffic split is approximate based on replica count

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: devops-app
      track: stable
  template:
    metadata:
      labels:
        app: devops-app
        track: stable
    spec:
      containers:
      - name: app
        image: shwetank/devops-app:v1
        ports:
        - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
      track: canary
  template:
    metadata:
      labels:
        app: devops-app
        track: canary
    spec:
      containers:
      - name: app
        image: shwetank/devops-app:v2
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app
spec:
  selector:
    app: devops-app
  ports:
  - port: 80
    targetPort: 3000
