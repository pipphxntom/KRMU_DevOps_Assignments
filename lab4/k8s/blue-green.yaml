apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-blue
  labels:
    app: devops-app
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
      version: blue
  template:
    metadata:
      labels:
        app: devops-app
        version: blue
    spec:
      containers:
      - name: app
        image: shwetank/devops-app:v1
        ports:
        - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-green
  labels:
    app: devops-app
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
      version: green
  template:
    metadata:
      labels:
        app: devops-app
        version: green
    spec:
      containers:
      - name: app
        image: shwetank/devops-app:v2
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app
spec:
  selector:
    app: devops-app
    version: blue   # switch to green for cutover
  ports:
  - port: 80
    targetPort: 3000
