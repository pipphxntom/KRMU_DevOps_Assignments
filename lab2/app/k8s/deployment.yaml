apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  labels:
    app: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: shwetank/devops-app:v1
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: version
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  version: "1.0"
  message: "Hello from Kubernetes"
